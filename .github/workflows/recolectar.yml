name: Recolección diaria de precios

on:
  schedule:
    - cron: "17 12 * * *"   # 12:17 UTC = 9:17 hora argentina
  workflow_dispatch:         # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Recolectar precios
        run: python recolectar.py

      - name: Guardar el CSV en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add datos_crudos/
          git diff --staged --quiet || git commit -m "Precios $(TZ=America/Argentina/Buenos_Aires date +%F)"
          git push
